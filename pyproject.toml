[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pavucli"
dynamic = ["version"]
description = "pavucontrol-like terminal mixer for PulseAudio and PipeWire"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["pulseaudio", "pipewire", "mixer", "volume", "tui", "curses"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]

[project.scripts]
pavucli = "pavucli.cli:main"

[tool.setuptools]
packages = ["pavucli"]

[tool.setuptools.dynamic]
version = { attr = "pavucli.__version__" }
